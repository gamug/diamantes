# Native theme for the online demo (src/streamlit_app.py). The bespoke pieces
# (hero band, estimated-value figure, prism ray, section rules) are styled in
# the app's own injected <style>; this sets the palette Streamlit's own widgets
# pick up: the "colorless-stone" cool white ground, a light mist for field
# fills, midnight-velvet as the primary (buttons / focus), cool near-black ink.
[theme]
base = "light"
primaryColor = "#0E1B2C"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#ECEFF5"
textColor = "#1B242E"
